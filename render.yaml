services:
  - type: web
    name: agrilink-api
    runtime: node
    # Free is suitable for a thesis demo with an external MySQL provider.
    # It may spin down when idle; use a paid plan before a real public launch.
    plan: free
    # NODE_ENV is production at runtime, but Vite and its config plugin are
    # development dependencies needed during this build step.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run preview
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: required
      - key: SESSION_SECRET
        generateValue: true
      - key: INITIAL_MANAGEMENT_SETUP_SECRET
        sync: false
