services:
  - type: web
    name: agrilink-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run preview
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INITIAL_MANAGEMENT_SETUP_SECRET
        sync: false
